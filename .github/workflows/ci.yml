name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # ruff is pinned to the same version .pre-commit-config.yaml uses, so the
      # hook, this job and a local `make lint` cannot disagree about formatting.
      # `tests/test_ci_contract.py` fails if the two pins drift apart.
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs always run: the whole point is to see which one disagrees.
      fail-fast: false
      matrix:
        db: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buchhaltung_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # B-60: the two databases hide different things from each other. SQLite has
      # no fixed-width integers, so `usage_events.quantity` overflowed int32 at
      # 2.1 GB on Postgres while the local suite stayed green for weeks; SQLite has
      # no row-level security, so the B-24 tests skip there entirely. Running one
      # leg and calling it "tests pass" is what let both through.
      DATABASE_URL: >-
        ${{ matrix.db == 'postgres'
        && 'postgresql+asyncpg://test:test@127.0.0.1:5432/buchhaltung_test'
        || 'sqlite+aiosqlite:///./ci.db' }}
      DATABASE_URL_SYNC: postgresql://test:test@127.0.0.1:5432/buchhaltung_test
      JWT_SECRET: test-secret-that-is-long-enough-for-ci-usage
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # The dev file is the toolchain AND the test-only deps (segno renders the
          # QR-bills the decoder tests read) — installing it keeps CI == `make test`.
          pip install -r backend/requirements-dev.txt
      - name: Tests + coverage
        run: pytest -q --cov=backend/app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always() && matrix.db == 'postgres'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations (upgrade · no drift)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buchhaltung_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/buchhaltung_test
      DATABASE_URL_SYNC: postgresql://test:test@127.0.0.1:5432/buchhaltung_test
      JWT_SECRET: test-secret-that-is-long-enough-for-ci-usage
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Downgrade to base and back up again
        working-directory: backend
        # A migration nobody has ever reversed is a migration that cannot be
        # rolled back at 3 a.m. This is also the leg that catches the
        # `921d958b8530` + `now()` default, which only breaks on the way down.
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Fail if models drifted from migrations
        working-directory: backend
        run: |
          alembic revision --autogenerate -m "drift-check" >/dev/null
          NEW=$(ls -t alembic/versions/*.py | head -1)
          if grep -qE '^\s+op\.(create|drop|add|alter|rename)_' "$NEW"; then
            echo "::error::Models changed without a migration. Run: make migration m=\"describe change\""
            cat "$NEW"
            exit 1
          fi
          rm -f "$NEW"

  frontend:
    name: Frontend (lint · types · unit · build · e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Playwright starts the real backend (SQLite) on this port; NEXT_PUBLIC_*
      # is inlined into the production build, so the build must see it too.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
      # Same value as E2E_BILLING_URL in playwright.config.ts — the switcher is
      # only rendered when this is set, and `next build` inlines it.
      NEXT_PUBLIC_BILLING_URL: http://127.0.0.1:5050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The e2e happy path runs against the real API (playwright.config.ts webServer).
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend for the e2e server
        run: pip install -r ../backend/requirements.txt
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: e2e tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  compose-smoke:
    name: Compose (build · up · health · worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the .env compose refuses to start without
        # Every one of these is a `${VAR:?}` in docker-compose.yml. Generating
        # them here is deliberate: a fixed value in the workflow would be a
        # credential in git, and `tests/test_deployment_contract.py` already
        # holds this list against the compose file.
        run: |
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
          } > .env
      - name: Build the images
        # The frontend image too — it was never built in CI, and it is the one
        # whose NEXT_PUBLIC_* build args are easy to break without noticing (B-62).
        run: docker compose build api worker web
      - name: Start the stack
        # Not ollama: nothing here needs a model, and the image is gigabytes.
        # `--wait` honours the api healthcheck, which is B-61's readiness probe.
        run: docker compose up -d --wait db redis api worker
      - name: The API says it is ready
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/live
      - name: The worker runs a pass and exits 0
        run: docker compose run --rm --entrypoint "" worker python -m app.worker --once
      - name: Logs, if anything above failed
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  api-contract:
    name: API contract (frontend types in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: cd frontend && npm ci
      - name: Regenerate API types
        env:
          JWT_SECRET: ci-secret-that-is-long-enough-for-generation
          ENVIRONMENT: test
        run: ./scripts/gen-api-types.sh
      - name: Fail if types are stale
        run: |
          if [[ -n "$(git status --porcelain -- frontend/src/lib/api-types.ts)" ]]; then
            echo "::error::frontend/src/lib/api-types.ts is out of date. Run: make api-types"
            git diff -- frontend/src/lib/api-types.ts
            exit 1
          fi

  security:
    name: Security (secrets · deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high || true
