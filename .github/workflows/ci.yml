name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buchhaltung_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/buchhaltung_test
      DATABASE_URL_SYNC: postgresql://test:test@127.0.0.1:5432/buchhaltung_test
      JWT_SECRET: test-secret-that-is-long-enough-for-ci-usage
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests + coverage
        run: pytest -q --cov=backend/app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations (upgrade · no drift)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buchhaltung_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/buchhaltung_test
      DATABASE_URL_SYNC: postgresql://test:test@127.0.0.1:5432/buchhaltung_test
      JWT_SECRET: test-secret-that-is-long-enough-for-ci-usage
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Fail if models drifted from migrations
        working-directory: backend
        run: |
          alembic revision --autogenerate -m "drift-check" >/dev/null
          NEW=$(ls -t alembic/versions/*.py | head -1)
          if grep -qE '^\s+op\.(create|drop|add|alter|rename)_' "$NEW"; then
            echo "::error::Models changed without a migration. Run: make migration m=\"describe change\""
            cat "$NEW"
            exit 1
          fi
          rm -f "$NEW"

  frontend:
    name: Frontend (lint · types · build · e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: e2e tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  api-contract:
    name: API contract (frontend types in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: cd frontend && npm ci
      - name: Regenerate API types
        env:
          JWT_SECRET: ci-secret-that-is-long-enough-for-generation
          ENVIRONMENT: test
        run: ./scripts/gen-api-types.sh
      - name: Fail if types are stale
        run: |
          if [[ -n "$(git status --porcelain -- frontend/src/lib/api-types.ts)" ]]; then
            echo "::error::frontend/src/lib/api-types.ts is out of date. Run: make api-types"
            git diff -- frontend/src/lib/api-types.ts
            exit 1
          fi

  security:
    name: Security (secrets · deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high || true
