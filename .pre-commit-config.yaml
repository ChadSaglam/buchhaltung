# Fast, local gates. Install once with: make setup  (or: pre-commit install)
default_install_hook_types: [pre-commit, pre-push]

# Generated or build-derived files: never reformat, never gate a commit on them.
exclude: |
  (?x)^(
    frontend/tsconfig\.tsbuildinfo|
    frontend/src/lib/api-types\.ts|
    frontend/package-lock\.json|
    .*\.min\.(js|css)
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: tsc
        name: TypeScript typecheck
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-push]

      # No prettier in the frontend toolchain — eslint is the formatter gate.
      - id: eslint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|css)$
        pass_filenames: false
        stages: [pre-push]

      # Mirrors CI "api-types" job: regenerate, then fail if the committed file drifted.
      - id: api-types
        name: API types are fresh
        entry: >-
          bash -c '
          ./scripts/gen-api-types.sh >/dev/null &&
          if ! git diff --quiet -- frontend/src/lib/api-types.ts; then
            echo "frontend/src/lib/api-types.ts is out of date. run: make api-types";
            git --no-pager diff --stat -- frontend/src/lib/api-types.ts;
            exit 1;
          fi'
        language: system
        files: ^backend/app/(routers|schemas|models)/.*\.py$
        pass_filenames: false
        stages: [pre-push]
