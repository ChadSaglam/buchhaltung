[alembic]
script_location = alembic
# Makes `backend/` importable no matter how alembic is invoked. Without this the
# `alembic` console script cannot find the `app` package (python -m alembic can,
# which is why this only ever failed in CI).
prepend_sys_path = .
# Intentionally empty: env.py takes the URL from app.core.config.settings, so no
# credential is ever committed here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
